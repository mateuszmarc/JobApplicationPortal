spring.application.name=joba-application-portal

spring.datasource.url=jdbc:mysql://localhost:3306/jobportal
spring.datasource.username=jobportal
spring.datasource.password=jobportal

spring.main.banner-mode=off
logging.level.root=warn

logging.level.org.hibernate.SQL=trace
logging.level.org.hibernate.orm.jdbc.bind=trace

password.validationRule=It Must contain at least one upper and one lower case character, number and special character. Must have at least six characters length.